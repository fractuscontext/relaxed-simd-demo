<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-Serving</title>
</head>
<body>
<h1>Self-Serving</h1>

<p><button id="reload">Reload page</button></p>

<h2>Status</h2>
<table border="1" cellpadding="4" cellspacing="0">
  <tr><th align="left">Service worker</th><td id="status">Checking...</td></tr>
</table>

<h2>Verdict</h2>
<table border="1" cellpadding="4" cellspacing="0" id="verdicts">
  <tr><td>Waiting...</td></tr>
</table>

<h2>Page vs service worker</h2>
<p>[differs] marks a service worker value that does not match the page value.</p>
<table border="1" cellpadding="4" cellspacing="0" id="results"></table>

<!-- Loads cpuProbe() into the page scope. -->
<script src="avx-probe.js"></script>
<script>
  const ROWS = [
    { group: 'Reported by navigator' },
    { key: 'userAgent', label: 'userAgent' },
    { key: 'platform', label: 'platform' },
    { key: 'cores', label: 'hardwareConcurrency' },
    { group: 'Reported by Client Hints' },
    { key: 'chPlatform', label: 'platform' },
    { key: 'chPlatformVersion', label: 'platformVersion' },
    { key: 'chArchitecture', label: 'architecture' },
    { key: 'chBitness', label: 'bitness' },
    { group: 'Measured by relaxed SIMD (avx-probe.js)' },
    { key: 'relaxedSimd', label: 'supported' },
    { key: 'isa', label: 'truncation ISA' },
    { key: 'fusedMadd', label: 'fused madd' },
    { key: 'inferred', label: 'inferred CPU' },
    { key: 'error', label: 'errors' },
  ];
  const FIELDS = ROWS.filter(r => r.key);
  const $ = id => document.getElementById(id);
  const show = v => (v === undefined || v === null || v === '') ? '-' : (typeof v === 'boolean' ? (v ? 'yes' : 'no') : String(v));

  // Build the results table once: one row per field, page and service worker columns.
  (function buildTable() {
    const table = $('results');
    const head = table.insertRow();
    for (const text of ['field', 'page', 'service worker']) {
      const th = document.createElement('th');
      th.textContent = text;
      head.appendChild(th);
    }
    for (const row of ROWS) {
      const tr = table.insertRow();
      if (row.group) {
        const th = document.createElement('th');
        th.colSpan = 3;
        th.align = 'left';
        th.textContent = row.group;
        tr.appendChild(th);
        continue;
      }
      const th = document.createElement('th');
      th.align = 'left';
      th.textContent = row.label;
      tr.appendChild(th);
      tr.insertCell().id = 'page-' + row.key;
      tr.insertCell().id = 'sw-' + row.key;
    }
  })();

  function setSwColumn(text) {
    for (const f of FIELDS) $('sw-' + f.key).textContent = text;
  }

  function setVerdicts(rows) {
    const table = $('verdicts');
    table.replaceChildren();
    const head = table.insertRow();
    for (const text of ['check', 'result']) {
      const th = document.createElement('th');
      th.textContent = text;
      head.appendChild(th);
    }
    for (const [check, result] of rows) {
      const tr = table.insertRow();
      tr.insertCell().textContent = check;
      tr.insertCell().textContent = result;
    }
  }

  // Architecture a scope claims, checked from the most to the least specific source.
  function claimedArch(r) {
    if (r.chArchitecture) {
      return { source: 'Client Hints architecture', value: r.chArchitecture, arch: /arm/i.test(r.chArchitecture) ? 'arm' : 'x86' };
    }
    if (r.platform) {
      if (/arm|aarch64/i.test(r.platform)) return { source: 'navigator.platform', value: r.platform, arch: 'arm' };
      if (/x86|i[3-6]86|win32|win64|macintel/i.test(r.platform)) return { source: 'navigator.platform', value: r.platform, arch: 'x86' };
    }
    if (r.userAgent) {
      if (/aarch64|arm64|armv\d/i.test(r.userAgent)) return { source: 'userAgent', value: 'ARM token', arch: 'arm' };
      if (/x86_64|x64|win64|wow64|intel/i.test(r.userAgent)) return { source: 'userAgent', value: 'x86 token', arch: 'x86' };
    }
    return null;
  }

  function claimVerdict(label, r) {
    const claim = claimedArch(r);
    if (r.isa !== 'x86' && r.isa !== 'arm') return [label, 'Hardware measurement unavailable (' + show(r.inferred) + ').'];
    if (!claim) return [label, 'Measured ' + r.inferred + '. No architecture claim found to compare against.'];
    const word = claim.arch === r.isa ? 'MATCHES' : 'CONTRADICTS';
    return [label, claim.source + ' (' + claim.value + ') ' + word + ' the measured CPU, ' + r.inferred + '.'];
  }

  // Page-side probe.
  const pageResult = cpuProbe().then(r => {
    for (const f of FIELDS) $('page-' + f.key).textContent = show(r[f.key]);
    return r;
  });

  // Service worker probe. Only asks the worker that controls this page,
  // so an old or not-yet-active worker never answers with stale values.
  let probeRun = 0;

  function runSwProbe() {
    const run = ++probeRun;
    const controller = navigator.serviceWorker.controller;

    if (!controller) {
      setSwColumn('(reload)');
      pageResult.then(page => setVerdicts([
        ['service worker', 'Registered but not controlling this page yet. Reload the page to run the service worker probe.'],
        claimVerdict('page claim vs CPU', page),
      ]));
      return;
    }

    setSwColumn('Waiting...');

    const swResult = new Promise((resolve, reject) => {
      const timer = setTimeout(
        () => reject(new Error('The controlling service worker did not reply. An older sw.js may still be in control; reload the page.')),
        5000
      );
      const channel = new MessageChannel();
      channel.port1.onmessage = event => {
        clearTimeout(timer);
        resolve(event.data);
      };
      controller.postMessage('probe', [channel.port2]);
    });

    Promise.all([pageResult, swResult]).then(([page, sw]) => {
      if (run !== probeRun) return;  // A newer run has started; skip stale output.
      let differs = [];
      for (const f of FIELDS) {
        let text = show(sw[f.key]);
        if (f.key !== 'error' && text !== show(page[f.key])) {
          text += ' [differs]';
          differs.push(f.label);
        }
        $('sw-' + f.key).textContent = text;
      }
      setVerdicts([
        ['page vs service worker', differs.length === 0
          ? 'All values match. No page-only spoof is active.'
          : differs.length + ' value(s) differ (' + differs.join(', ') + '). A page-only spoof is likely, and the service worker values show the real browser.'],
        claimVerdict('page claim vs CPU', page),
        claimVerdict('service worker claim vs CPU', sw),
      ]);
      console.log('Page probe:', page);
      console.log('Service worker probe:', sw);
    }).catch(err => {
      if (run !== probeRun) return;
      setSwColumn('(reload)');
      pageResult.then(page => setVerdicts([
        ['service worker', err.message],
        claimVerdict('page claim vs CPU', page),
      ]));
    });
  }

  function reportStatus() {
    $('status').textContent = navigator.serviceWorker.controller
      ? '✓ Controlled by service worker. This page can now load offline.'
      : 'Service worker registered but not controlling this page. Reload the page.';
  }

  $('reload').addEventListener('click', () => location.reload());

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => {
      reportStatus();
      runSwProbe();
      // clients.claim() in sw.js can take control without a reload; probe again when that happens.
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        reportStatus();
        runSwProbe();
      });
    }).catch(err => {
      $('status').textContent = '✗ Registration failed: ' + err.message;
      setSwColumn('-');
      pageResult.then(page => setVerdicts([claimVerdict('page claim vs CPU', page)]));
    });
  } else {
    $('status').textContent = '✗ Service workers are not supported here (HTTPS or localhost required).';
    setSwColumn('-');
    pageResult.then(page => setVerdicts([claimVerdict('page claim vs CPU', page)]));
  }
</script>
</body>
</html>
